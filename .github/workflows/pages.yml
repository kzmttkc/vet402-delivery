# Build the public ranking site from data/ and publish it with GitHub Pages.
# No secrets: the build only reads files in this repository (npm run rank -- --data data never touches the network).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rank from data/ only
        run: npm run rank -- --data data --offline --out "$RUNNER_TEMP/rank"
      - name: Build the site
        run: |
          date=$(node -p "require('./data/manifest.json').date")
          npx tsx scripts/build-site.ts --report "$RUNNER_TEMP/rank/rank-$date.json" --out "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
