[package]
name = "delivery-gate-example"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Example: a program that proceeds only when observation-roots says a purchase was DELIVERED"

[lib]
crate-type = ["cdylib", "lib"]
name = "delivery_gate_example"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "observation-roots/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=0.32.2"
observation-roots = { path = "../observation-roots", features = ["cpi"] }
